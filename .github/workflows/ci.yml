name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  proto:
    name: proto (lint + codegen drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install buf v1.75.0
        run: |
          curl -fsSL -o /tmp/buf "https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-$(uname -s)-$(uname -m)"
          chmod +x /tmp/buf
          sudo mv /tmp/buf /usr/local/bin/buf
          buf --version
      - name: Lint proto
        run: buf lint
      - name: Generate gRPC / gateway / OpenAPI code
        run: buf generate
      - name: Check generated code is committed
        run: |
          git add -N gen/
          git diff --exit-code -- gen/

  go:
    name: build + vet + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tradeforge
          POSTGRES_PASSWORD: tradeforge
          POSTGRES_DB: tradeforge
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tradeforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TRADEFORGE_TEST_DSN: postgres://tradeforge:tradeforge@localhost:55432/tradeforge?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        run: go test ./... -race -count=1
      - name: Integration tests (race)
        run: go test -tags=integration -race -count=1 ./internal/oms -v
      - name: E2E full-chain smoke
        env:
          TRADEFORGE_GRPC_ADDR: 127.0.0.1:19090
          TRADEFORGE_HTTP_ADDR: 127.0.0.1:18080
          TRADEFORGE_DB_DSN: postgres://tradeforge:tradeforge@localhost:55432/tradeforge?sslmode=disable
          TRADEFORGE_JWT_SECRET: ci-e2e
          TRADEFORGE_BCRYPT_COST: 4
        run: |
          set -e
          go build -o /tmp/tf-server ./cmd/server
          /tmp/tf-server >/tmp/tf-e2e-server.log 2>&1 &
          srv=$!
          trap 'kill -9 $srv 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          ./scripts/e2e.sh
      - name: E2E broker-gateway chain
        env:
          GOPROXY: https://proxy.golang.org,direct
          TRADEFORGE_BCRYPT_COST: 4
        run: |
          set -e
          # Keep the two chains on separate databases when a client is available;
          # e2e-broker.sh also auto-creates the database if psql is installed.
          if command -v psql >/dev/null 2>&1; then
            export PGPASSWORD=tradeforge
            psql -h localhost -p 55432 -U tradeforge -d postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname='tradeforge_bgw'" | grep -q 1 \
              || psql -h localhost -p 55432 -U tradeforge -d postgres -c "CREATE DATABASE tradeforge_bgw"
            export BGW_TEST_DB_DSN="postgres://tradeforge:tradeforge@localhost:55432/tradeforge_bgw?sslmode=disable"
          fi
          ./scripts/e2e-broker.sh
