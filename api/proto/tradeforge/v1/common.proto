syntax = "proto3";

package tradeforge.v1;

option go_package = "github.com/viviwu/tradeforge/gen/tradeforge/v1;tradeforgev1";

// Side is the order side.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

// OrderType is the order execution type.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

// TimeInForce controls how long an order remains active.
enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

// OrderStatus is the lifecycle state of an order.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING_NEW = 1;
  ORDER_STATUS_ACCEPTED = 2;
  ORDER_STATUS_PARTIALLY_FILLED = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELED = 5;
  ORDER_STATUS_REJECTED = 6;
}

// StrategyStatus is the lifecycle state of a strategy.
enum StrategyStatus {
  STRATEGY_STATUS_UNSPECIFIED = 0;
  STRATEGY_STATUS_CREATED = 1;
  STRATEGY_STATUS_RUNNING = 2;
  STRATEGY_STATUS_PAUSED = 3;
  STRATEGY_STATUS_STOPPED = 4;
  STRATEGY_STATUS_ERROR = 5;
}

// MarketEventType distinguishes market data payloads.
enum MarketEventType {
  MARKET_EVENT_TYPE_UNSPECIFIED = 0;
  MARKET_EVENT_TYPE_TICK = 1;
  MARKET_EVENT_TYPE_BOOK = 2;
}
